# Example for a host-local Prometheus. Give its service account independent
# read-only copies of the CA and metrics token; never copy root keys here.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/moco-alerts.yaml
scrape_configs:
  - job_name: moco
    scheme: https
    static_configs:
      - targets: [localhost:9443]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/moco/metrics-token
    tls_config:
      ca_file: /etc/prometheus/moco/ca.pem
      server_name: localhost
      min_version: TLS12
