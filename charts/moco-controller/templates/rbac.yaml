apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "moco-controller.name" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "moco-controller.name" . }}
rules:
  - apiGroups: [moco.araihu.io]
    resources: [mocotenants, mocovaults, mocoauthorizations]
    verbs: [get, list, watch]
  - apiGroups: [moco.araihu.io]
    resources: [mocotenants/status, mocovaults/status, mocoauthorizations/status]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.credentialsSecret | quote }}]
    verbs: [get]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "moco-controller.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "moco-controller.name" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "moco-controller.name" . }}
