openapi: 3.0.3
info:
  title: Mocó Internal Operations API
  version: 0.6.0
  description: |
    Process probes, deployment-scoped authorization administration, and a
    restricted request audit ledger for security observability. The audit
    operation is not a reconciliation/change feed; controllers and operators
    use the public watch endpoint and relist contract for convergence.
    The encryption operation performs bounded online rewraps of vault data keys
    under the configured active root-key era; key material is supplied only by
    deployment configuration and is never accepted or returned by this API.
    Administrative operations are intended for a restricted deployment origin;
    they never expose bearer token digests or request payloads.
  contact:
    name: AraiHu
    url: https://github.com/araihu/moco
servers:
  - url: /
    description: Direct deployment origin, normally restricted by network policy.
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Process liveness and traffic readiness probes.
  - name: Authorization
    description: Restricted replacement of the persisted authorization snapshot.
  - name: Audit
    description: Restricted request metadata ledger for security observability; not a reconciliation feed.
  - name: Encryption
    description: Restricted bounded root-key rewrap maintenance; never accepts or returns key material.
paths:
  /livez:
    get:
      operationId: getLiveness
      summary: Check process liveness
      description: Returns 200 while the server process can handle HTTP requests.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Process is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/health-status'
  /readyz:
    get:
      operationId: getReadiness
      summary: Check traffic readiness
      description: |
        Returns 200 when the instance can serve product traffic and 503 otherwise.
        The body deliberately omits dependency and configuration details.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Instance is ready for product traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/health-status'
        '503':
          description: Instance is not ready for product traffic.
          headers:
            Retry-After:
              $ref: '#/components/headers/retry-after'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unavailable-status'
  /internal/v1/authorization:
    parameters:
      - $ref: '#/components/parameters/request-id'
    get:
      operationId: getAuthorizationSnapshot
      summary: Read the persisted authorization snapshot
      description: Returns the complete role-binding and policy snapshot without token digests. The ETag is the authoritative snapshot revision. A policy's optional secretPathPrefix narrows the decoded logical path or prefix query value for a secret item, metadata, or collection route and is a literal prefix match.
      tags: [Authorization]
      responses:
        '200':
          description: Persisted authorization snapshot.
          headers:
            ETag:
              $ref: '#/components/headers/etag'
            X-Request-ID:
              $ref: '#/components/headers/request-id'
          content:
            application/json:
              example:
                initialized: true
                revision: 3
                roleBindings:
                  - principal: controller
                    role: secret-reader
                    domain: tenant-a
                policies:
                  - subject: secret-reader
                    domain: tenant-a
                    path: /api/v1/tenants/{tenantId}/vaults/{vaultId}/secret
                    method: GET
              schema:
                $ref: '#/components/schemas/authorization-snapshot'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internal-error'
        '503':
          $ref: '#/components/responses/service-unavailable'
    put:
      operationId: replaceAuthorizationSnapshot
      summary: Replace the persisted authorization snapshot
      description: Atomically replaces all role bindings and policies when If-Match identifies the revision observed by the writer. A committed change signals local reloaders and is discovered by shared-store polling in other processes. Set secretPathPrefix only on a policy for a canonical secret operation route; policies without it remain vault-scoped.
      tags: [Authorization]
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Strong ETag returned by the latest GET or PUT response. Use `*` to apply against the revision observed immediately before this request.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        description: Complete replacement snapshot; empty arrays mean default-deny.
        content:
          application/json:
            example:
              roleBindings:
                - principal: controller
                  role: secret-reader
                  domain: tenant-a
              policies:
                - subject: secret-reader
                  domain: tenant-a
                  path: /api/v1/tenants/{tenantId}/vaults/{vaultId}/secret
                  method: GET
            schema:
              $ref: '#/components/schemas/authorization-snapshot-input'
      responses:
        '200':
          description: Newly persisted authorization snapshot.
          headers:
            ETag:
              $ref: '#/components/headers/etag'
            X-Request-ID:
              $ref: '#/components/headers/request-id'
          content:
            application/json:
              example:
                initialized: true
                revision: 4
                roleBindings:
                  - principal: controller
                    role: secret-reader
                    domain: tenant-a
                policies:
                  - subject: secret-reader
                    domain: tenant-a
                    path: /api/v1/tenants/{tenantId}/vaults/{vaultId}/secret
                    method: GET
              schema:
                $ref: '#/components/schemas/authorization-snapshot'
        '400':
          $ref: '#/components/responses/bad-request'
        '412':
          $ref: '#/components/responses/precondition-failed'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internal-error'
        '503':
          $ref: '#/components/responses/service-unavailable'
  /internal/v1/audit:
    parameters:
      - $ref: '#/components/parameters/request-id'
    get:
      operationId: listAuditEvents
      summary: List request audit events
      description: Returns request metadata in ascending durable sequence order for security observability. This is not a reconciliation or change-feed operation; controllers and operators must use the public watch endpoint and relist contract for convergence. Query strings, request bodies, bearer credentials, and plaintext logical secret paths are never returned; secret paths are represented only by keyed HMAC-SHA-256 digests. Reads from this endpoint are not themselves recorded, so a tailing client cannot create self-events. The endpoint is internal and requires an explicit authorization policy for its exact path.
      tags: [Audit]
      parameters:
        - $ref: '#/components/parameters/audit-after-sequence'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Ordered audit event page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/request-id'
          content:
            application/json:
              example:
                items: []
                hasMore: false
                nextAfterSequence: null
              schema:
                $ref: '#/components/schemas/audit-event-list'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internal-error'
        '503':
          $ref: '#/components/responses/service-unavailable'
  /internal/v1/encryption/rotation:
    parameters:
      - $ref: '#/components/parameters/request-id'
    post:
      operationId: rotateEncryptionKeys
      summary: Rewrap one bounded page of vault data keys
      description: Rewraps persisted vault data keys whose root key ID is not the configured active era. The active and previous root keys are loaded from deployment configuration; this operation never accepts, returns, or logs key material. Repeating a page is safe. Use both returned keyset checkpoints to continue when hasMore is true, then run a fresh sweep until complete is true and remainingOldKeys is zero. The server persists an encryption-key epoch and rejects stale processes; the expected active ID and epoch are revalidated atomically in each key replacement, so all writers must start with the current epoch before maintenance. Rotation changes only wrapped-key bytes, not secret ciphertext, resource versions, or API representations, and may be run concurrently by workers in the same epoch.
      tags: [Encryption]
      parameters:
        - $ref: '#/components/parameters/encryption-after-tenant-id'
        - $ref: '#/components/parameters/encryption-after-vault-id'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Bounded rotation result.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/request-id'
          content:
            application/json:
              example:
                activeRootKeyId: root-v2
                activeRootKeyEpoch: 2
                scanned: 50
                rewrapped: 47
                skipped: 3
                hasMore: true
                complete: false
                nextAfterTenantId: 11111111-1111-4111-8111-111111111111
                nextAfterVaultId: 22222222-2222-4222-8222-222222222222
                remainingOldKeys: 3
              schema:
                $ref: '#/components/schemas/encryption-rotation-result'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internal-error'
        '503':
          $ref: '#/components/responses/service-unavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Deployment-issued bearer credential for restricted operations.
  schemas:
    health-status:
      title: HealthStatus
      type: object
      description: Minimal probe result with no deployment details.
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
    unavailable-status:
      title: UnavailableStatus
      type: object
      description: Minimal readiness failure with no dependency details.
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - unavailable
          example: unavailable
    authorization-snapshot:
      title: AuthorizationSnapshot
      type: object
      description: Persisted authorization state; token digests are intentionally omitted.
      additionalProperties: false
      required:
        - initialized
        - revision
        - roleBindings
        - policies
      properties:
        initialized:
          type: boolean
          readOnly: true
          example: true
        revision:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: Monotonic snapshot revision used by ETag and optimistic concurrency.
          example: 3
        roleBindings:
          type: array
          maxItems: 10000
          example:
            - principal: controller
              role: secret-reader
              domain: tenant-a
          items:
            $ref: '#/components/schemas/authorization-role-binding'
        policies:
          type: array
          maxItems: 10000
          example:
            - subject: secret-reader
              domain: tenant-a
              path: /api/v1/tenants/{tenantId}/vaults/{vaultId}/secret
              method: GET
          items:
            $ref: '#/components/schemas/authorization-policy'
    authorization-snapshot-input:
      title: AuthorizationSnapshotInput
      type: object
      description: Complete replacement snapshot; empty arrays intentionally mean default-deny.
      additionalProperties: false
      required:
        - roleBindings
        - policies
      properties:
        roleBindings:
          type: array
          maxItems: 10000
          example:
            - principal: controller
              role: secret-reader
              domain: tenant-a
          items:
            $ref: '#/components/schemas/authorization-role-binding'
        policies:
          type: array
          maxItems: 10000
          example:
            - subject: secret-reader
              domain: tenant-a
              path: /api/v1/tenants/{tenantId}/vaults/{vaultId}/secret
              method: GET
          items:
            $ref: '#/components/schemas/authorization-policy'
    authorization-role-binding:
      title: AuthorizationRoleBinding
      type: object
      description: Principal-to-role binding scoped to one authorization domain.
      additionalProperties: false
      required:
        - principal
        - role
        - domain
      properties:
        principal:
          type: string
          minLength: 1
          maxLength: 128
          example: controller
        role:
          type: string
          minLength: 1
          maxLength: 128
          example: secret-reader
        domain:
          type: string
          minLength: 1
          maxLength: 128
          example: 11111111-1111-4111-8111-111111111111
    authorization-policy:
      title: AuthorizationPolicy
      type: object
      description: Allow policy for a role or principal, domain, path pattern, and HTTP method. Secret operation policies may additionally narrow access to a literal logical secret path prefix.
      additionalProperties: false
      required:
        - subject
        - domain
        - path
        - method
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 128
          example: secret-reader
        domain:
          type: string
          minLength: 1
          maxLength: 128
          example: 11111111-1111-4111-8111-111111111111
        path:
          type: string
          minLength: 7
          maxLength: 512
          example: /api/v1/tenants/{tenantId}/vaults/{vaultId}/secret
        method:
          type: string
          minLength: 1
          maxLength: 16
          example: GET
        secretPathPrefix:
          type: string
          minLength: 1
          maxLength: 1024
          description: Literal logical secret path prefix. Only valid when path is the secret item, secret metadata, or secret collection route; the decoded path/prefix query value must begin with this prefix. An empty collection prefix is not authorized for a path-scoped policy. The reserved value '*' preserves legacy vault-wide behavior.
          example: prod/database/
    problem:
      title: Problem
      type: object
      description: Problem Details response compatible with RFC 9457.
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - requestId
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable documentation URI for this problem type.
          example: https://moco.araihu.com/problems/not-found
        title:
          type: string
          minLength: 1
          example: Not Found
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          example: 404
        code:
          type: string
          minLength: 1
          description: |
            Stable machine-readable error code. Implementations currently use
            unauthorized, forbidden, invalid_request, invalid_json,
            invalid_content_type, invalid_request_id, validation_failed,
            invalid_if_match, invalid_if_none_match, invalid_cursor, cursor_expired,
            invalid_resource_version, invalid_watch_timeout, resource_version_ahead,
            resource_not_found,
            resource_conflict, resource_has_children, idempotency_key_conflict,
            etag_mismatch, secret_too_large, invalid_rotation_checkpoint,
            invalid_limit, encryption_key_epoch_conflict, service_unavailable,
            and internal_error.
          example: resource_not_found
        detail:
          type: string
          description: Human-readable detail that never contains secret values.
          example: The requested resource does not exist.
        instance:
          type: string
          format: uri-reference
          description: Occurrence identifier for support correlation.
          example: urn:moco:request:11111111-1111-4111-8111-111111111111
        requestId:
          type: string
          minLength: 1
          description: Correlation identifier also returned in X-Request-ID.
          example: 11111111-1111-4111-8111-111111111111
        resourceId:
          type: string
          description: Existing resource ID when safely useful for conflict recovery.
          example: 11111111-1111-4111-8111-111111111111
        errors:
          type: array
          example:
            - field: /name
              code: invalid_format
              message: must match the documented name format
          items:
            $ref: '#/components/schemas/problem-error'
    problem-error:
      title: ProblemError
      type: object
      description: Field-specific validation failure safe to expose to clients.
      additionalProperties: false
      required:
        - message
      properties:
        field:
          type: string
          description: JSON Pointer or parameter name when the failure has a location.
          example: /name
        code:
          type: string
          minLength: 1
          description: Stable machine-readable validation code.
          example: invalid_format
        message:
          type: string
          minLength: 1
          description: Human-readable message that never contains secret values.
          example: must match the documented name format
    audit-event-list:
      title: AuditEventList
      type: object
      description: Ordered page from the append-only audit ledger.
      additionalProperties: false
      required:
        - items
        - hasMore
        - nextAfterSequence
      properties:
        items:
          type: array
          example:
            - sequence: 42
              occurredAt: '2026-08-29T15:04:05Z'
              requestId: 11111111-1111-4111-8111-111111111111
              principalId: operator
              method: GET
              route: /api/v1/tenants/11111111-1111-4111-8111-111111111111
              statusCode: 200
              outcome: success
          items:
            $ref: '#/components/schemas/audit-event'
        hasMore:
          type: boolean
          description: Whether another event exists after the last returned sequence.
          example: false
        nextAfterSequence:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Exclusive checkpoint for the next page; null when hasMore is false.
          example:
    audit-event:
      title: AuditEvent
      type: object
      description: Request audit metadata without request bodies, query strings, credentials, or plaintext secret paths.
      additionalProperties: false
      required:
        - sequence
        - occurredAt
        - requestId
        - method
        - route
        - statusCode
        - outcome
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          example: 42
        occurredAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-08-29T15:04:05Z'
        requestId:
          type: string
          minLength: 1
          maxLength: 128
          readOnly: true
          example: 11111111-1111-4111-8111-111111111111
        principalId:
          type: string
          minLength: 1
          maxLength: 128
          nullable: true
          readOnly: true
          description: Authenticated principal identifier; absent when authentication did not succeed.
          example: operator
        method:
          type: string
          minLength: 1
          maxLength: 16
          readOnly: true
          example: GET
        route:
          type: string
          minLength: 1
          maxLength: 2048
          readOnly: true
          description: Request path without its query string.
          example: /api/v1/tenants/11111111-1111-4111-8111-111111111111
        statusCode:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          readOnly: true
          example: 200
        outcome:
          type: string
          enum:
            - success
            - failure
          readOnly: true
          example: success
        secretPathSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          minLength: 64
          maxLength: 64
          nullable: true
          readOnly: true
          description: Keyed HMAC-SHA-256 digest of the decoded logical secret path or list prefix; the plaintext is never persisted and the deployment key is never returned.
          example: 2bb80d537b1da3e38bd30361aa855686bde0ba53e611d8a8a5e47993629e366f
    encryption-rotation-result:
      type: object
      additionalProperties: false
      required:
        - activeRootKeyEpoch
        - activeRootKeyId
        - complete
        - hasMore
        - nextAfterTenantId
        - nextAfterVaultId
        - remainingOldKeys
        - rewrapped
        - scanned
        - skipped
      description: Bounded root-key rewrap result. It contains counts and a keyset checkpoint only; no key material or secret data is returned.
      properties:
        activeRootKeyId:
          type: string
          minLength: 1
          maxLength: 128
          readOnly: true
          description: Identifier of the deployment key era used for new and rewrapped vault keys.
          example: root-v2
        activeRootKeyEpoch:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: Monotonic deployment epoch that fences stale server processes during rollout.
          example: 2
        scanned:
          type: integer
          format: int32
          minimum: 0
          maximum: 200
          readOnly: true
          example: 50
        rewrapped:
          type: integer
          format: int32
          minimum: 0
          maximum: 200
          readOnly: true
          example: 47
        skipped:
          type: integer
          format: int32
          minimum: 0
          maximum: 200
          readOnly: true
          description: Keys already using the active era or changed by another worker before this request committed.
          example: 3
        hasMore:
          type: boolean
          readOnly: true
          example: true
        complete:
          type: boolean
          readOnly: true
          description: True when no vault key currently uses an older root-key era. A fresh full sweep should be run after transient failures or concurrent maintenance.
          example: false
        nextAfterTenantId:
          type: string
          minLength: 1
          maxLength: 128
          nullable: true
          readOnly: true
          description: Checkpoint for the next page; null when hasMore is false.
          example: 11111111-1111-4111-8111-111111111111
        nextAfterVaultId:
          type: string
          minLength: 1
          maxLength: 128
          nullable: true
          readOnly: true
          description: Checkpoint for the next page; null when hasMore is false.
          example: 22222222-2222-4222-8222-222222222222
        remainingOldKeys:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: Current count of vault keys whose root key ID differs from the active era; this is not a snapshot.
          example: 3
  responses:
    unauthorized:
      description: Bearer authentication is missing or invalid.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/www-authenticate'
        X-Request-ID:
          $ref: '#/components/headers/request-id'
      content:
        application/problem+json:
          example:
            type: https://moco.araihu.com/problems/unauthorized
            title: Unauthorized
            status: 401
            code: unauthorized
            requestId: 11111111-1111-4111-8111-111111111111
          schema:
            $ref: '#/components/schemas/problem'
    forbidden:
      description: The authenticated principal lacks permission for the operation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/request-id'
      content:
        application/problem+json:
          example:
            type: https://moco.araihu.com/problems/forbidden
            title: Forbidden
            status: 403
            code: forbidden
            requestId: 11111111-1111-4111-8111-111111111111
          schema:
            $ref: '#/components/schemas/problem'
    internal-error:
      description: The server failed to complete the request.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/request-id'
      content:
        application/problem+json:
          example:
            type: https://moco.araihu.com/problems/internal-error
            title: Internal Server Error
            status: 500
            code: internal_error
            requestId: 11111111-1111-4111-8111-111111111111
          schema:
            $ref: '#/components/schemas/problem'
    service-unavailable:
      description: |
        The service or a required dependency is temporarily unavailable. This may be
        emitted by Mocó or by the deployment edge; clients should retry after the
        advertised interval with bounded exponential backoff.
      headers:
        Retry-After:
          $ref: '#/components/headers/retry-after'
        X-Request-ID:
          $ref: '#/components/headers/request-id'
      content:
        application/problem+json:
          example:
            type: https://moco.araihu.com/problems/service-unavailable
            title: Service Unavailable
            status: 503
            code: service_unavailable
            requestId: 11111111-1111-4111-8111-111111111111
          schema:
            $ref: '#/components/schemas/problem'
    bad-request:
      description: Request parameters, headers, or body are invalid.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/request-id'
      content:
        application/problem+json:
          example:
            type: https://moco.araihu.com/problems/bad-request
            title: Bad Request
            status: 400
            code: invalid_request
            requestId: 11111111-1111-4111-8111-111111111111
          schema:
            $ref: '#/components/schemas/problem'
    precondition-failed:
      description: A conditional request header does not match current resource state.
      headers:
        ETag:
          $ref: '#/components/headers/etag'
        X-Request-ID:
          $ref: '#/components/headers/request-id'
      content:
        application/problem+json:
          example:
            type: https://moco.araihu.com/problems/precondition-failed
            title: Precondition Failed
            status: 412
            code: etag_mismatch
            requestId: 11111111-1111-4111-8111-111111111111
          schema:
            $ref: '#/components/schemas/problem'
    conflict:
      description: |
        The request conflicts with current resource state, a uniqueness constraint,
        existing children, or a prior idempotency-key body. Uniqueness conflicts set
        `resourceId` when the existing resource can be identified safely; clients
        may use it to adopt rather than create a duplicate.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/request-id'
      content:
        application/problem+json:
          example:
            type: https://moco.araihu.com/problems/conflict
            title: Conflict
            status: 409
            code: resource_conflict
            requestId: 11111111-1111-4111-8111-111111111111
          schema:
            $ref: '#/components/schemas/problem'
  parameters:
    request-id:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller correlation ID; the server returns the effective ID.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    audit-after-sequence:
      name: afterSequence
      in: query
      required: false
      description: Exclusive audit sequence checkpoint. Use the returned nextAfterSequence to continue the same ordered ledger page.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
