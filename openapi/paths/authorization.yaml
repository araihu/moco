parameters:
  - $ref: ../components/parameters/request-id.yaml
get:
  operationId: getAuthorizationSnapshot
  summary: Read the persisted authorization snapshot
  description: Returns the complete role-binding and policy snapshot without token digests. The ETag is the authoritative snapshot revision. A policy's optional secretPathPrefix narrows the decoded logical path or prefix query value for a secret item, metadata, or collection route and is a literal prefix match.
  tags: [Authorization]
  responses:
    '200':
      description: Persisted authorization snapshot.
      headers:
        ETag:
          $ref: ../components/headers/etag.yaml
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          example:
            initialized: true
            revision: 3
            roleBindings:
              - principal: controller
                role: secret-reader
                domain: tenant-a
            policies:
              - subject: secret-reader
                domain: tenant-a
                path: /api/v1/tenants/{tenantId}/vaults/{vaultId}/secret
                method: GET
          schema:
            $ref: ../components/schemas/authorization-snapshot.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '500':
      $ref: ../components/responses/internal-error.yaml
    '503':
      $ref: ../components/responses/service-unavailable.yaml
put:
  operationId: replaceAuthorizationSnapshot
  summary: Replace the persisted authorization snapshot
  description: Atomically replaces all role bindings and policies when If-Match identifies the revision observed by the writer. A committed change signals local reloaders and is discovered by shared-store polling in other processes. Set secretPathPrefix only on a policy for a canonical secret operation route; policies without it remain vault-scoped.
  tags: [Authorization]
  parameters:
    - name: If-Match
      in: header
      required: true
      description: Strong ETag returned by the latest GET or PUT response. Use `*` to apply against the revision observed immediately before this request.
      schema:
        type: string
        minLength: 1
  requestBody:
    required: true
    description: Complete replacement snapshot; empty arrays mean default-deny.
    content:
      application/json:
        example:
          roleBindings:
            - principal: controller
              role: secret-reader
              domain: tenant-a
          policies:
            - subject: secret-reader
              domain: tenant-a
              path: /api/v1/tenants/{tenantId}/vaults/{vaultId}/secret
              method: GET
        schema:
          $ref: ../components/schemas/authorization-snapshot-input.yaml
  responses:
    '200':
      description: Newly persisted authorization snapshot.
      headers:
        ETag:
          $ref: ../components/headers/etag.yaml
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          example:
            initialized: true
            revision: 4
            roleBindings:
              - principal: controller
                role: secret-reader
                domain: tenant-a
            policies:
              - subject: secret-reader
                domain: tenant-a
                path: /api/v1/tenants/{tenantId}/vaults/{vaultId}/secret
                method: GET
          schema:
            $ref: ../components/schemas/authorization-snapshot.yaml
    '400':
      $ref: ../components/responses/bad-request.yaml
    '412':
      $ref: ../components/responses/precondition-failed.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '500':
      $ref: ../components/responses/internal-error.yaml
    '503':
      $ref: ../components/responses/service-unavailable.yaml
