parameters:
  - $ref: ../components/parameters/tenant-id.yaml
  - $ref: ../components/parameters/vault-id.yaml
  - $ref: ../components/parameters/request-id.yaml
get:
  operationId: listSecrets
  summary: List secret metadata
  description: |
    Lists metadata only; values are never returned. The first request creates a
    sequence-bounded snapshot. Follow `nextCursor` until `hasMore` is false. If
    the cursor expires, restart without one. Omit prefix to list the complete
    vault. Use `GET /api/v1/watch` as a full-resync signal after mutations,
    including deletions.
  tags: [Secrets]
  parameters:
    - $ref: ../components/parameters/secret-prefix.yaml
    - $ref: ../components/parameters/limit.yaml
    - $ref: ../components/parameters/cursor.yaml
  responses:
    '200':
      description: Page of secret metadata ordered by immutable insertion sequence.
      headers:
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/secret-list.yaml
    '400':
      $ref: ../components/responses/bad-request.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      $ref: ../components/responses/not-found.yaml
    '410':
      $ref: ../components/responses/cursor-expired.yaml
    '429':
      $ref: ../components/responses/too-many-requests.yaml
    '500':
      $ref: ../components/responses/internal-error.yaml
    '503':
      $ref: ../components/responses/service-unavailable.yaml
