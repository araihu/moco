parameters:
  - $ref: ../components/parameters/tenant-id.yaml
  - $ref: ../components/parameters/vault-id.yaml
  - $ref: ../components/parameters/secret-path.yaml
  - $ref: ../components/parameters/request-id.yaml
get:
  operationId: getSecret
  summary: Read a secret
  description: |
    Returns one secret including its base64-encoded value. Clients must keep the
    response out of logs, status fields, events, metrics, traces, and caches.
    Authorization is evaluated at vault granularity; `path` is not a policy
    boundary, so use a dedicated vault when a secret needs a separate scope.
  tags: [Secrets]
  parameters:
    - $ref: ../components/parameters/if-none-match.yaml
  responses:
    '200':
      description: Secret value and metadata.
      headers:
        ETag:
          $ref: ../components/headers/etag.yaml
        Cache-Control:
          $ref: ../components/headers/cache-control.yaml
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/secret.yaml
    '304':
      $ref: ../components/responses/secret-not-modified.yaml
    '400':
      $ref: ../components/responses/bad-request.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      $ref: ../components/responses/not-found.yaml
    '429':
      $ref: ../components/responses/too-many-requests.yaml
    '500':
      $ref: ../components/responses/internal-error.yaml
    '503':
      $ref: ../components/responses/service-unavailable.yaml
put:
  operationId: putSecret
  summary: Create or replace a secret
  description: |
    Creates or replaces the value at path. `If-None-Match: *` makes the request
    create-only; `If-Match` makes it replace-only at a known ETag. Sending both
    headers returns 400. Without either header the operation is an unconditional,
    idempotent upsert. The response contains metadata, never the submitted value.
    Authorization remains vault-scoped; the logical path does not narrow a
    vault policy.
  tags: [Secrets]
  parameters:
    - $ref: ../components/parameters/if-match.yaml
    - $ref: ../components/parameters/if-none-match.yaml
  requestBody:
    description: Secret value. The decoded payload is limited to 1 MiB.
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/secret-write.yaml
  responses:
    '200':
      description: Existing secret replaced.
      headers:
        ETag:
          $ref: ../components/headers/etag.yaml
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/secret-metadata.yaml
    '201':
      description: New secret created.
      headers:
        ETag:
          $ref: ../components/headers/etag.yaml
        Location:
          $ref: ../components/headers/location.yaml
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/secret-metadata.yaml
    '400':
      $ref: ../components/responses/bad-request.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      $ref: ../components/responses/not-found.yaml
    '412':
      $ref: ../components/responses/precondition-failed.yaml
    '413':
      $ref: ../components/responses/payload-too-large.yaml
    '429':
      $ref: ../components/responses/too-many-requests.yaml
    '500':
      $ref: ../components/responses/internal-error.yaml
    '503':
      $ref: ../components/responses/service-unavailable.yaml
delete:
  operationId: deleteSecret
  summary: Delete a secret
  description: |
    Deletes the value at path. A missing secret returns 404; reconcilers may
    treat that response as successful convergence.
  tags: [Secrets]
  parameters:
    - $ref: ../components/parameters/if-match.yaml
  responses:
    '204':
      description: Secret deleted.
      headers:
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
    '400':
      $ref: ../components/responses/bad-request.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      $ref: ../components/responses/not-found.yaml
    '412':
      $ref: ../components/responses/precondition-failed.yaml
    '429':
      $ref: ../components/responses/too-many-requests.yaml
    '500':
      $ref: ../components/responses/internal-error.yaml
    '503':
      $ref: ../components/responses/service-unavailable.yaml
