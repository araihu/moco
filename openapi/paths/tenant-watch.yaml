parameters:
  - $ref: ../components/parameters/tenant-id.yaml
  - $ref: ../components/parameters/request-id.yaml
get:
  operationId: watchTenantChanges
  summary: Wait for changes within one tenant
  description: |
    Returns a durable resource checkpoint scoped to the tenant. With no
    `resourceVersion`, the endpoint returns the current checkpoint immediately.
    With a checkpoint, it returns immediately when that checkpoint is stale or
    waits up to `timeoutSeconds` for a newer tenant, vault, or secret mutation.
    A true `changed` result is only a signal to relist the collections the
    caller is authorized to manage; this endpoint does not expose payloads,
    ordering, or tombstones. The checkpoint survives tenant deletion as a
    tombstone, so a watcher that already knows the tenant can observe its final
    mutation. A tenant that has never existed returns 404.
  tags: [Service]
  parameters:
    - $ref: ../components/parameters/tenant-resource-version.yaml
    - $ref: ../components/parameters/watch-timeout.yaml
  responses:
    '200':
      description: Current tenant checkpoint and whether it advanced.
      headers:
        Cache-Control:
          $ref: ../components/headers/cache-control.yaml
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/tenant-watch-result.yaml
    '400':
      $ref: ../components/responses/bad-request.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      $ref: ../components/responses/not-found.yaml
    '429':
      $ref: ../components/responses/too-many-requests.yaml
    '500':
      $ref: ../components/responses/internal-error.yaml
    '503':
      $ref: ../components/responses/service-unavailable.yaml
