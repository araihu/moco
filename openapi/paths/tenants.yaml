parameters:
  - $ref: ../components/parameters/request-id.yaml
get:
  operationId: listTenants
  summary: List tenants
  description: |
    Lists tenants visible to the principal. The first request creates a stable
    snapshot; follow `nextCursor` until `hasMore` is false. If a cursor expires,
    restart without one. Name and externalId filters are exact and may be combined.
  tags: [Tenants]
  parameters:
    - $ref: ../components/parameters/limit.yaml
    - $ref: ../components/parameters/cursor.yaml
    - $ref: ../components/parameters/name-filter.yaml
    - $ref: ../components/parameters/external-id-filter.yaml
  responses:
    '200':
      description: Page of tenants from a stable snapshot.
      headers:
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          example:
            items:
              - id: 11111111-1111-4111-8111-111111111111
                name: production
                labels: {}
                revision: 1
                createdAt: '2026-08-25T12:00:00Z'
                updatedAt: '2026-08-25T12:00:00Z'
            page:
              hasMore: false
              nextCursor: null
          schema:
            $ref: ../components/schemas/tenant-list.yaml
    '400':
      $ref: ../components/responses/bad-request.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '410':
      $ref: ../components/responses/cursor-expired.yaml
    '429':
      $ref: ../components/responses/too-many-requests.yaml
    '500':
      $ref: ../components/responses/internal-error.yaml
    '503':
      $ref: ../components/responses/service-unavailable.yaml
post:
  operationId: createTenant
  summary: Create a tenant
  description: |
    Creates a tenant. Name and externalId are independently unique. Repeating an
    identical request with the same Idempotency-Key returns the original result;
    reusing that key with another body returns 409.
  tags: [Tenants]
  parameters:
    - $ref: ../components/parameters/idempotency-key.yaml
  requestBody:
    description: Tenant creation fields.
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/tenant-create.yaml
  responses:
    '201':
      description: Tenant created, or prior identical keyed result replayed.
      headers:
        ETag:
          $ref: ../components/headers/etag.yaml
        Location:
          $ref: ../components/headers/location.yaml
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/tenant.yaml
    '400':
      $ref: ../components/responses/bad-request.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '409':
      $ref: ../components/responses/conflict.yaml
    '429':
      $ref: ../components/responses/too-many-requests.yaml
    '500':
      $ref: ../components/responses/internal-error.yaml
    '503':
      $ref: ../components/responses/service-unavailable.yaml
