title: SecretWrite
type: object
description: Secret value and media type accepted for storage.
x-sensitive: true
additionalProperties: false
required: [value]
properties:
  value:
    type: string
    format: byte
    minLength: 1
    maxLength: 1398104
    description: Base64-encoded value, limited to 1 MiB after decoding.
    example: c2VjcmV0
  contentType:
    type: string
    minLength: 1
    maxLength: 255
    default: application/octet-stream
    example: text/plain
