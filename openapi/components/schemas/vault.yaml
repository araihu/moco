title: Vault
type: object
description: Tenant-scoped vault identity, automation metadata, and lifecycle state.
additionalProperties: false
required: [id, tenantId, name, labels, revision, createdAt, updatedAt]
properties:
  id:
    type: string
    format: uuid
    readOnly: true
    description: Server-assigned stable identifier.
    example: 22222222-2222-4222-8222-222222222222
  tenantId:
    type: string
    format: uuid
    readOnly: true
    example: 11111111-1111-4111-8111-111111111111
  name:
    type: string
    minLength: 1
    maxLength: 128
    pattern: '^[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?$'
    description: Human-readable name, unique within its tenant.
    example: application
  description:
    type: string
    maxLength: 1024
    nullable: true
    example: Application runtime secrets
  externalId:
    type: string
    minLength: 1
    maxLength: 512
    readOnly: true
    nullable: true
    description: Immutable caller correlation identifier, unique within its tenant.
    example: kubernetes://cluster-a/platform/vault-application
  labels:
    $ref: ./labels.yaml
  revision:
    type: integer
    format: int64
    minimum: 1
    readOnly: true
    description: Monotonic resource revision; the HTTP ETag remains authoritative.
    example: 2
  createdAt:
    type: string
    format: date-time
    readOnly: true
    example: '2026-08-25T12:00:00Z'
  updatedAt:
    type: string
    format: date-time
    readOnly: true
    example: '2026-08-25T13:00:00Z'
