title: Secret
type: object
description: Secret metadata and value. Consumers must never log this object.
x-sensitive: true
additionalProperties: false
required: [path, value, version, digest, contentType, createdAt, updatedAt]
properties:
  path:
    type: string
    minLength: 1
    maxLength: 1024
    pattern: '^[^/]+(?:/[^/]+)*$'
    description: Slash-delimited logical path; `.`, `..`, and empty segments are invalid.
    example: prod/db/password
  value:
    type: string
    format: byte
    minLength: 1
    maxLength: 1398104
    description: Base64-encoded value, limited to 1 MiB after decoding.
    example: c2VjcmV0
  version:
    type: integer
    format: int64
    minimum: 1
    readOnly: true
    example: 4
  digest:
    type: string
    pattern: '^sha256:[a-f0-9]{64}$'
    readOnly: true
    description: SHA-256 digest of the decoded value.
    example: sha256:2bb80d537b1da3e38bd30361aa855686bde0ba53e611d8a8a5e47993629e366f
  contentType:
    type: string
    minLength: 1
    maxLength: 255
    example: text/plain
  createdAt:
    type: string
    format: date-time
    readOnly: true
    example: '2026-08-25T12:00:00Z'
  updatedAt:
    type: string
    format: date-time
    readOnly: true
    example: '2026-08-25T13:00:00Z'
