title: Problem
type: object
description: Problem Details response compatible with RFC 9457.
additionalProperties: false
required: [type, title, status, code, requestId]
properties:
  type:
    type: string
    format: uri-reference
    description: Stable documentation URI for this problem type.
    example: https://moco.araihu.com/problems/not-found
  title:
    type: string
    minLength: 1
    example: Not Found
  status:
    type: integer
    format: int32
    minimum: 400
    maximum: 599
    example: 404
  code:
    type: string
    minLength: 1
    description: |
      Stable machine-readable error code. Implementations currently use
      unauthorized, forbidden, invalid_request, invalid_json,
      invalid_content_type, invalid_request_id, validation_failed,
      invalid_if_match, invalid_if_none_match, invalid_cursor, cursor_expired,
      invalid_resource_version, invalid_watch_timeout, resource_version_ahead,
      resource_not_found,
      resource_conflict, resource_has_children, idempotency_key_conflict,
      etag_mismatch, secret_too_large, service_unavailable, and internal_error.
    example: resource_not_found
  detail:
    type: string
    description: Human-readable detail that never contains secret values.
    example: The requested resource does not exist.
  instance:
    type: string
    format: uri-reference
    description: Occurrence identifier for support correlation.
    example: urn:moco:request:11111111-1111-4111-8111-111111111111
  requestId:
    type: string
    minLength: 1
    description: Correlation identifier also returned in X-Request-ID.
    example: 11111111-1111-4111-8111-111111111111
  resourceId:
    type: string
    description: Existing resource ID when safely useful for conflict recovery.
    example: 11111111-1111-4111-8111-111111111111
  errors:
    type: array
    example:
      - field: /name
        code: invalid_format
        message: must match the documented name format
    items:
      $ref: ./problem-error.yaml
