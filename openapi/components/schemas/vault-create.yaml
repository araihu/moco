title: VaultCreate
type: object
description: Fields accepted when creating a vault.
additionalProperties: false
required: [name]
properties:
  name:
    type: string
    minLength: 1
    maxLength: 128
    pattern: '^[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?$'
    example: application
  description:
    type: string
    maxLength: 1024
    nullable: true
    example: Application runtime secrets
  externalId:
    type: string
    minLength: 1
    maxLength: 512
    description: Immutable caller correlation identifier, unique within the tenant.
    example: kubernetes://cluster-a/platform/vault-application
  labels:
    $ref: ./labels.yaml
