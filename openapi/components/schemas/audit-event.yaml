title: AuditEvent
type: object
description: Request audit metadata without request bodies, query strings, credentials, or plaintext secret paths.
additionalProperties: false
required: [sequence, occurredAt, requestId, method, route, statusCode, outcome]
properties:
  sequence:
    type: integer
    format: int64
    minimum: 1
    readOnly: true
    example: 42
  occurredAt:
    type: string
    format: date-time
    readOnly: true
    example: '2026-08-29T15:04:05Z'
  requestId:
    type: string
    minLength: 1
    maxLength: 128
    readOnly: true
    example: 11111111-1111-4111-8111-111111111111
  principalId:
    type: string
    minLength: 1
    maxLength: 128
    nullable: true
    readOnly: true
    description: Authenticated principal identifier; absent when authentication did not succeed.
    example: operator
  method:
    type: string
    minLength: 1
    maxLength: 16
    readOnly: true
    example: GET
  route:
    type: string
    minLength: 1
    maxLength: 2048
    readOnly: true
    description: Request path without its query string.
    example: /api/v1/tenants/11111111-1111-4111-8111-111111111111
  statusCode:
    type: integer
    format: int32
    minimum: 100
    maximum: 599
    readOnly: true
    example: 200
  outcome:
    type: string
    enum: [success, failure]
    readOnly: true
    example: success
  secretPathSha256:
    type: string
    pattern: '^[0-9a-f]{64}$'
    minLength: 64
    maxLength: 64
    nullable: true
    readOnly: true
    description: SHA-256 digest of the decoded logical secret path or list prefix; the plaintext is never persisted.
    example: 2bb80d537b1da3e38bd30361aa855686bde0ba53e611d8a8a5e47993629e366f
