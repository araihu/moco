title: AuthorizationPolicy
type: object
description: Allow policy for a role or principal, domain, path pattern, and HTTP method. Secret item policies may additionally narrow access to a literal logical secret path prefix.
additionalProperties: false
required: [subject, domain, path, method]
properties:
  subject:
    type: string
    minLength: 1
    maxLength: 128
    example: secret-reader
  domain:
    type: string
    minLength: 1
    maxLength: 128
    example: 11111111-1111-4111-8111-111111111111
  path:
    type: string
    minLength: 7
    maxLength: 512
    example: /api/v1/tenants/{tenantId}/vaults/{vaultId}/secret
  method:
    type: string
    minLength: 1
    maxLength: 16
    example: GET
  secretPathPrefix:
    type: string
    minLength: 1
    maxLength: 1024
    description: Literal logical secret path prefix. Only valid when path is /api/v1/tenants/{tenantId}/vaults/{vaultId}/secret; the prefix is matched byte-for-byte after URL decoding.
    example: prod/database/
