title: AuditRetentionResult
type: object
additionalProperties: false
description: Bounded local audit retention result. It contains no event contents; remaining is a current diagnostic rather than a historical snapshot.
required: [before, complete, deleted, hasMore, remaining]
properties:
  before:
    type: string
    format: date-time
    readOnly: true
    description: Normalized UTC cutoff used by the retention batch.
    example: '2026-08-01T00:00:00Z'
  deleted:
    type: integer
    format: int32
    minimum: 0
    maximum: 200
    readOnly: true
    description: Number of events deleted by this bounded request.
    example: 50
  remaining:
    type: integer
    format: int64
    minimum: 0
    readOnly: true
    description: Current number of events strictly before the cutoff; this is not a snapshot.
    example: 12
  hasMore:
    type: boolean
    readOnly: true
    description: Whether another bounded retention request is needed for the cutoff.
    example: true
  complete:
    type: boolean
    readOnly: true
    description: True when no event currently remains before the cutoff.
    example: false
