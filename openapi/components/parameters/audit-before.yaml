name: before
in: query
required: true
description: Delete events strictly older than this UTC cutoff. The cutoff must be at least one hour old for deletion. Repeat the same cutoff until the response reports complete=true; use dryRun=true to preview without deleting.
schema:
  type: string
  format: date-time
  minLength: 1
  maxLength: 64
  example: '2026-08-01T00:00:00Z'
