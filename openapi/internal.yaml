openapi: 3.0.3
info:
  title: Mocó Internal Operations API
  version: 0.8.0
  description: |
    Process probes, deployment-scoped authorization administration, and a
    restricted request audit ledger for security observability. The audit
    operation is not a reconciliation/change feed; controllers and operators
    use the public watch endpoint and relist contract for convergence. A
    bounded local retention operation removes events before an operator-supplied
    cutoff without changing public resource history.
    The encryption operation performs bounded online rewraps of vault data keys
    under the configured active root-key era; key material is supplied only by
    deployment configuration and is never accepted or returned by this API.
    Administrative operations are intended for a restricted deployment origin;
    they never expose bearer token digests or request payloads.
  contact:
    name: AraiHu
    url: https://github.com/araihu/moco
servers:
  - url: /
    description: Direct deployment origin, normally restricted by network policy.
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Process liveness and traffic readiness probes.
  - name: Authorization
    description: Restricted replacement of the persisted authorization snapshot.
  - name: Audit
    description: Restricted request metadata ledger for security observability; not a reconciliation feed.
  - name: Encryption
    description: Restricted bounded root-key rewrap maintenance; never accepts or returns key material.
paths:
  /livez:
    $ref: ./paths/livez.yaml
  /readyz:
    $ref: ./paths/readyz.yaml
  /internal/v1/authorization:
    $ref: ./paths/authorization.yaml
  /internal/v1/audit:
    $ref: ./paths/audit.yaml
  /internal/v1/audit/retention:
    $ref: ./paths/audit-retention.yaml
  /internal/v1/encryption/rotation:
    $ref: ./paths/encryption-rotation.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Deployment-issued bearer credential for restricted operations.
