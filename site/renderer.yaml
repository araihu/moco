version: 1
organization:
  title: Moco API
  readme: >-
    Look up requests, responses and errors for your own Moco instance.
    Use the public API to manage tenants, vaults and secrets. Use the administrative API
    to manage authorization, audit and root-key rotation with an explicitly permitted principal.
    Administrative endpoints belong on a private deployment origin.
    [Try Moco locally](https://moco.araihu.com/getting-started/) ·
    [Configure security](https://moco.araihu.com/guides/security/) ·
    [Install Moco](https://moco.araihu.com/guides/installation/).
  seo:
    description: Moco OpenAPI reference for tenants, vaults, secrets, authorization, audit and encryption maintenance.
    canonicalBase: https://moco.araihu.com/openapi
    socialImage: https://moco.araihu.com/site/assets/social.png
    socialImageAlt: Mocó API and administration reference
catalogs:
  - id: moco
    mount: /catalogs/moco
    title: Moco API contracts
    readme: >-
      Choose the public contract for tenant, vault and secret operations, or the internal
      contract for probes and administrative operations. Use your deployment URL and a bearer
      credential with permission for the operation. This site provides read-only documentation;
      it does not accept credentials or send API requests.
      [Read how contracts and CLI overlays work](https://moco.araihu.com/reference/openapi-pipeline/).
    defaultDocument: public
    profile: strict-v1
    seo:
      description: Public and internal Moco contracts rendered from the checked-in OpenAPI bundles.
      canonicalBase: https://moco.araihu.com/openapi/catalogs/moco
      socialImage: https://moco.araihu.com/site/assets/social.png
      socialImageAlt: Mocó API and administration reference
    source:
      kind: files
      root: ../openapi/bundled
      include: [public.yaml, internal.yaml]
