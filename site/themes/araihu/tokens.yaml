schema: margo.theme.tokens/v1
css_digest: sha256-9ec3f3187b736252b18f3aefef4737ba2025ef1c637611c3d0ecf58748043f1b
# The stylesheet is the unchanged organization theme. Margo owns document layout.
fonts: []
minimum_text_size: 1rem
touch_target: {min_css_px: 44}
typography:
  display: {font_family: '"Lato", ui-sans-serif, system-ui, sans-serif'}
  headline: {font_family: '"Lato", ui-sans-serif, system-ui, sans-serif'}
  title: {font_family: '"Lato", ui-sans-serif, system-ui, sans-serif'}
  body: {font_family: '"Lato", ui-sans-serif, system-ui, sans-serif', size: 1rem}
  label: {font_family: '"Lato", ui-sans-serif, system-ui, sans-serif'}
  caption: {alias_of: label}
layout: {reading_measure: 75ch}
spacing: {scale: [0.25rem, 0.5rem, 0.75rem, 1rem, 1.5rem, 2rem]}
breakpoints:
  - {name: narrow, min_css_px: 0, max_css_px: 720}
  - {name: mid, min_css_px: 720, max_css_px: 1100}
  - {name: wide, min_css_px: 1100}
grid: {main: 'minmax(0, 75ch)'}
drawer: {max_inline_size: 'min(22rem, 85vi)'}
colors:
  light: {surface: '#f3f2e9', surface-alt: '#e4e8eb', text: '#243348', text-strong: '#07111f', accent: '#173b72', outline: '#a3b0bf', focus-ring: '#173b72'}
  dark: {surface: '#07111f', surface-alt: '#10233d', text: '#d5ddeb', text-strong: '#f7f8f3', accent: '#c7ff4a', outline: '#526981', focus-ring: '#c7ff4a'}
states:
  light:
    default: {background: '#f3f2e9', foreground: '#243348'}
    hover: {background: '#e4e8eb', foreground: '#07111f'}
    pressed: {background: '#173b72', foreground: '#ffffff'}
    focus: {background: '#f3f2e9', foreground: '#07111f'}
    selected: {background: '#173b72', foreground: '#ffffff'}
    disabled: {background: '#e4e8eb', foreground: '#64748b'}
  dark:
    default: {background: '#07111f', foreground: '#d5ddeb'}
    hover: {background: '#10233d', foreground: '#f7f8f3'}
    pressed: {background: '#c7ff4a', foreground: '#07111f'}
    focus: {background: '#07111f', foreground: '#f7f8f3'}
    selected: {background: '#c7ff4a', foreground: '#07111f'}
    disabled: {background: '#10233d', foreground: '#718397'}
feedback:
  light:
    info: {foreground: '#ffffff', background: '#1476b8', cue: icon-or-text}
    success: {foreground: '#ffffff', background: '#258256', cue: icon-or-text}
    warning: {foreground: '#ffffff', background: '#a85e00', cue: icon-or-text}
    error: {foreground: '#ffffff', background: '#b42c46', cue: icon-or-text}
  dark:
    info: {foreground: '#ffffff', background: '#1476b8', cue: icon-or-text}
    success: {foreground: '#ffffff', background: '#258256', cue: icon-or-text}
    warning: {foreground: '#ffffff', background: '#a85e00', cue: icon-or-text}
    error: {foreground: '#ffffff', background: '#b42c46', cue: icon-or-text}
contrast_pairs:
  entries:
    - {mode: light, foreground: '#243348', background: '#f3f2e9', ratio: 4.5}
    - {mode: dark, foreground: '#d5ddeb', background: '#07111f', ratio: 4.5}
