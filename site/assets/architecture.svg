<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
<title id="title">How Moco manages and delivers secrets</title><desc id="desc">API and CLI or Kubernetes controller connect to Moco, which encrypts secret values in local SQLite. External Secrets Operator reads permitted values and creates Kubernetes Secrets for applications.</desc>
<rect width="640" height="640" rx="28" fill="#07111f"/>
<g fill="none" stroke="#526981" stroke-width="2"><path d="M170 164v62h150v50M470 164v62H320M320 406v66M320 530v36"/><path d="m311 462 9 10 9-10M311 556l9 10 9-10"/></g>
<g font-family="system-ui, sans-serif" text-anchor="middle">
<text x="40" y="48" text-anchor="start" fill="#c7ff4a" font-size="12" letter-spacing="3">HOW MOCO DELIVERS SECRETS</text>
<g fill="#10233d" stroke="#526981"><rect x="40" y="86" width="260" height="78" rx="12"/><rect x="340" y="86" width="260" height="78" rx="12"/></g>
<g fill="#f7f8f3" font-size="20" font-weight="600"><text x="170" y="119">API + CLI</text><text x="470" y="119">Kubernetes controller</text></g>
<g fill="#d5ddeb" font-size="13"><text x="170" y="144">Direct requests</text><text x="470" y="144">Tenants · vaults · access policies</text></g>
<rect x="130" y="276" width="380" height="130" rx="16" fill="#c7ff4a"/>
<text x="320" y="317" font-size="30" font-weight="700" fill="#07111f">Mocó</text>
<text x="320" y="347" fill="#07111f" font-size="15">Encrypted values · local SQLite</text>
<text x="320" y="375" fill="#243348" font-size="13">Scoped access / transactional audit / recovery</text>
<rect x="130" y="472" width="380" height="58" rx="12" fill="#10233d" stroke="#526981"/>
<text x="320" y="507" fill="#f7f8f3" font-size="18">External Secrets Operator</text>
<text x="320" y="594" fill="#f7f8f3" font-size="18">Application ← Kubernetes Secret</text>
<text x="320" y="622" fill="#d5ddeb" font-size="12">Moco manages resources and access. ESO delivers values.</text>
</g></svg>
