openapi: 3.0.3
info:
  title: Mocó API
  version: 0.1.0
  description: Tenant-isolated, path-based secret management API.
  contact:
    name: AraiHu
    url: https://github.com/araihu/moco
tags:
  - name: Tenants
    description: Tenant lifecycle operations.
  - name: Vaults
    description: Tenant-scoped vault lifecycle operations.
  - name: Secrets
    description: Vault-scoped secret value and prefix operations.
security:
  - bearerAuth: []
servers:
  - url: /
    description: Current deployment origin.
paths:
  /api/v1/tenants:
    get:
      operationId: listTenants
      summary: List tenants
      description: Lists tenants visible to the authenticated principal.
      tags: [Tenants]
      responses:
        "200":
          description: Tenant list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
              example:
                - id: 11111111-1111-4111-8111-111111111111
                  name: production
                  createdAt: "2026-08-25T12:00:00Z"
                  updatedAt: "2026-08-25T12:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTenant
      summary: Create a tenant
      description: Creates a tenant with a unique name.
      tags: [Tenants]
      requestBody:
        description: Tenant creation fields.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCreate"
            example:
              name: production
      responses:
        "201":
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
              example:
                id: 11111111-1111-4111-8111-111111111111
                name: production
                createdAt: "2026-08-25T12:00:00Z"
                updatedAt: "2026-08-25T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tenants/{tenantId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: getTenant
      summary: Get a tenant
      description: Returns one tenant by ID.
      tags: [Tenants]
      responses:
        "200":
          description: Tenant found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
              example:
                id: 11111111-1111-4111-8111-111111111111
                name: production
                createdAt: "2026-08-25T12:00:00Z"
                updatedAt: "2026-08-25T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateTenant
      summary: Update a tenant
      description: Replaces the tenant name with a new non-empty name.
      tags: [Tenants]
      requestBody:
        description: Tenant update fields.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
            example:
              name: platform
      responses:
        "200":
          description: Tenant updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
              example:
                id: 11111111-1111-4111-8111-111111111111
                name: platform
                createdAt: "2026-08-25T12:00:00Z"
                updatedAt: "2026-08-25T13:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteTenant
      summary: Delete a tenant
      description: Deletes a tenant and its tenant-scoped resources.
      tags: [Tenants]
      responses:
        "204":
          description: Tenant deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tenants/{tenantId}/vaults:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: listVaults
      summary: List vaults
      description: Lists vaults belonging to the tenant.
      tags: [Vaults]
      responses:
        "200":
          description: Vault list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vault"
              example:
                - id: 22222222-2222-4222-8222-222222222222
                  tenantId: 11111111-1111-4111-8111-111111111111
                  name: application
                  createdAt: "2026-08-25T12:00:00Z"
                  updatedAt: "2026-08-25T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createVault
      summary: Create a vault
      description: Creates a vault in the tenant with a unique name.
      tags: [Vaults]
      requestBody:
        description: Vault creation fields.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultCreate"
            example:
              name: application
      responses:
        "201":
          description: Vault created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
              example:
                id: 22222222-2222-4222-8222-222222222222
                tenantId: 11111111-1111-4111-8111-111111111111
                name: application
                createdAt: "2026-08-25T12:00:00Z"
                updatedAt: "2026-08-25T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tenants/{tenantId}/vaults/{vaultId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/VaultId"
    get:
      operationId: getVault
      summary: Get a vault
      description: Returns one tenant-scoped vault by ID.
      tags: [Vaults]
      responses:
        "200":
          description: Vault found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
              example:
                id: 22222222-2222-4222-8222-222222222222
                tenantId: 11111111-1111-4111-8111-111111111111
                name: application
                createdAt: "2026-08-25T12:00:00Z"
                updatedAt: "2026-08-25T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateVault
      summary: Update a vault
      description: Replaces the vault name with a new non-empty name.
      tags: [Vaults]
      requestBody:
        description: Vault update fields.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultUpdate"
            example:
              name: platform
      responses:
        "200":
          description: Vault updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
              example:
                id: 22222222-2222-4222-8222-222222222222
                tenantId: 11111111-1111-4111-8111-111111111111
                name: platform
                createdAt: "2026-08-25T12:00:00Z"
                updatedAt: "2026-08-25T13:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteVault
      summary: Delete a vault
      description: Deletes a vault and all secrets stored in it.
      tags: [Vaults]
      responses:
        "204":
          description: Vault deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tenants/{tenantId}/vaults/{vaultId}/secrets:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/VaultId"
    get:
      operationId: getSecrets
      summary: Get a secret or list secret metadata
      description: Exactly one of path or prefix is required. Path returns one secret including its value; prefix returns matching metadata without values.
      tags: [Secrets]
      parameters:
        - name: path
          in: query
          required: false
          description: Slash-delimited secret path. Empty, `.`, and `..` segments are forbidden.
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - $ref: "#/components/parameters/SecretPrefix"
      responses:
        "200":
          description: Secret or secret metadata list selected by the query parameter.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Secret"
                  - $ref: "#/components/schemas/SecretList"
              example:
                path: prod/db/password
                value: c2VjcmV0
                createdAt: "2026-08-25T12:00:00Z"
                updatedAt: "2026-08-25T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: putSecret
      summary: Write a secret
      description: Creates or replaces the secret at the required path.
      tags: [Secrets]
      parameters:
        - $ref: "#/components/parameters/SecretPath"
      requestBody:
        description: Secret value to write.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretWrite"
            example:
              value: c2VjcmV0
      responses:
        "200":
          description: Secret written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
              example:
                path: prod/db/password
                value: c2VjcmV0
                createdAt: "2026-08-25T12:00:00Z"
                updatedAt: "2026-08-25T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteSecret
      summary: Delete a secret
      description: Deletes the secret at the required path.
      tags: [Secrets]
      parameters:
        - $ref: "#/components/parameters/SecretPath"
      responses:
        "204":
          description: Secret deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Tenant UUID.
      schema:
        type: string
        format: uuid
    VaultId:
      name: vaultId
      in: path
      required: true
      description: Vault UUID.
      schema:
        type: string
        format: uuid
    SecretPath:
      name: path
      in: query
      required: true
      description: Required slash-delimited item path; empty, `.`, and `..` segments are forbidden.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    SecretPrefix:
      name: prefix
      in: query
      required: false
      description: Slash-delimited prefix used to list secret metadata. One optional trailing slash is allowed; empty interior, `.`, and `..` segments are forbidden.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token supplied in the Authorization header.
  schemas:
    Tenant:
      type: object
      description: Tenant identity and lifecycle metadata.
      additionalProperties: false
      required: [id, name, createdAt, updatedAt]
      example:
        id: 11111111-1111-4111-8111-111111111111
        name: production
        createdAt: "2026-08-25T12:00:00Z"
        updatedAt: "2026-08-25T12:00:00Z"
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: 11111111-1111-4111-8111-111111111111
        name:
          type: string
          minLength: 1
          example: production
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-08-25T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-08-25T12:00:00Z"
    TenantCreate:
      type: object
      description: Fields accepted when creating a tenant.
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: production
    TenantUpdate:
      type: object
      description: Fields accepted when updating a tenant.
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: platform
    Vault:
      type: object
      description: Tenant-scoped vault identity and lifecycle metadata.
      additionalProperties: false
      required: [id, tenantId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: 22222222-2222-4222-8222-222222222222
        tenantId:
          type: string
          format: uuid
          readOnly: true
          example: 11111111-1111-4111-8111-111111111111
        name:
          type: string
          minLength: 1
          example: application
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-08-25T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-08-25T12:00:00Z"
    VaultCreate:
      type: object
      description: Fields accepted when creating a vault.
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: application
    VaultUpdate:
      type: object
      description: Fields accepted when updating a vault.
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: platform
    SecretMetadata:
      type: object
      description: Secret identity and lifecycle metadata without its value.
      additionalProperties: false
      required: [path, createdAt, updatedAt]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 1024
          description: Metadata path uses slash-delimited segments and forbids empty, `.`, and `..` segments.
          example: prod/db/password
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-08-25T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-08-25T12:00:00Z"
    Secret:
      type: object
      description: Secret metadata and base64-encoded value.
      additionalProperties: false
      required: [path, value, createdAt, updatedAt]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 1024
          description: Returned item path uses slash-delimited segments and forbids empty, `.`, and `..` segments.
          example: prod/db/password
        value:
          type: string
          format: byte
          description: Base64-encoded secret value.
          example: c2VjcmV0
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-08-25T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-08-25T12:00:00Z"
    SecretList:
      type: object
      description: Secret metadata matching a prefix; values are never included.
      additionalProperties: false
      required: [secrets]
      properties:
        secrets:
          type: array
          example:
            - path: prod/db/password
              createdAt: "2026-08-25T12:00:00Z"
              updatedAt: "2026-08-25T12:00:00Z"
          items:
            $ref: "#/components/schemas/SecretMetadata"
    SecretWrite:
      type: object
      description: Base64-encoded secret value to store at the query path.
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          format: byte
          description: Base64-encoded value accepted for storage.
          example: c2VjcmV0
    Problem:
      type: object
      description: Problem Details response based on RFC 7807.
      additionalProperties: false
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
          minLength: 1
          example: Not Found
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          example: 404
        detail:
          type: string
          example: Requested resource does not exist.
        instance:
          type: string
          format: uri
          example: urn:moco:request:11111111-1111-4111-8111-111111111111
  responses:
    BadRequest:
      description: Request parameters or body are invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Bad Request
            status: 400
            detail: Request parameters or body are invalid.
    Unauthorized:
      description: Bearer authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Unauthorized
            status: 401
            detail: Bearer authentication is missing or invalid.
    Forbidden:
      description: Principal lacks permission for the operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Forbidden
            status: 403
            detail: Principal lacks permission for the operation.
    NotFound:
      description: Requested tenant, vault, or secret does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Not Found
            status: 404
            detail: Requested resource does not exist.
    Conflict:
      description: Request conflicts with current resource state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Conflict
            status: 409
            detail: Request conflicts with current resource state.
    InternalError:
      description: Server failed to complete the request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Internal Server Error
            status: 500
            detail: Server failed to complete the request.
