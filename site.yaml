version: 1
source: site/.build/content
output: dist/site
assets: local
offline: true
site:
  name: Mocó
  description: Self-hosted secret management for your homelab. Manage application credentials through the API, CLI or Kubernetes controller.
  version: v0.0.3
  repository_url: https://github.com/araihu/moco
  base_url: https://moco.araihu.com
  home: index.md
  logo: site/assets/mark.svg
  icon: site/assets/mark.svg
  social_image:
    path: site/assets/social.png
    alt: Mocó. Secret management for your homelab, with an API, CLI and Kubernetes controller.
layout:
  kind: docs
  default:
    families: [docs]
    sidebar: true
    toc: true
    content:
      layout: article
  values:
    family: docs
locales:
  default: en
  supported: [en]
navigation:
  mode: file-tree
theme:
  builtin: true
  name: modern
  color_mode: light
custom_css:
  - css_url: site/theme.css
