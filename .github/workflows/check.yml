name: check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DAGGER_NO_NAG: '1'

jobs:
  helm-chart:
    runs-on: ubuntu-24.04
    container:
      image: golang:1.27.3-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5
    timeout-minutes: 15
    strategy:
      matrix:
        helm: ['v3.22.1', 'v4.3.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ matrix.helm }}
      - name: Validate chart schemas, rendering, safety guards and packaging
        run: make chart-check
      - name: Validate rendered Kubernetes API objects
        shell: bash
        run: |
          set -euo pipefail
          helm template ci charts/moco -f charts/moco/ci/test-values.yaml --kube-version 1.32.0 \
            --set ingress.enabled=true,ingress.className=private,ingress.hostname=moco.example.com,ingress.tlsSecret=moco-tls > "$RUNNER_TEMP/moco.yaml"
          GOWORK=off go run github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0 \
            -strict -summary -kubernetes-version 1.32.0 "$RUNNER_TEMP/moco.yaml"
  check:
    env:
      # Override any runner-wide endpoint so bootstrap uses this engine/SDK too.
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-image://registry.dagger.io/engine:v0.21.11@sha256:6b557cc8b5fdfee0e2e8c82d451ac922097a1255482143e1b96c0be3ff2a303c
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-pr"]') ||
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install exact Dagger CLI for this job
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: '0.21.11'

      - name: Require exact Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 { print $2 }')" = v0.21.11

      - name: Validate Go SDK bootstrap
        shell: bash
        run: |
          set -euo pipefail
          dagger develop
          git diff --exit-code -- dagger.json dagger/go.mod dagger/go.sum
          dagger functions

      - name: Build Go tools
        shell: bash
        # Large cold-build progress traces can delay CLI shutdown after success.
        run: dagger --silent call build-tools entries

      - name: Run required checks
        shell: bash
        env:
          RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: dagger --silent call check --run-nonce="$RUN_NONCE"

  production-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and exercise production image
        run: make image-check IMAGE=moco:ci IMAGE_VERSION=${{ github.sha }}
      - name: Validate monitoring alert rules
        run: make monitoring-check
