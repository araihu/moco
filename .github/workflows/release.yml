name: release

on:
  push:
    tags: ['v*', '[0-9]*']

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    container:
      image: golang:1.27.3-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      oci_tag: ${{ steps.plan.outputs.oci_tag }}
      commit: ${{ steps.plan.outputs.commit }}
      image_repository: ${{ steps.plan.outputs.image_repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and test the release helper
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/release-tools"
          GOWORK=off go -C tools test -mod=readonly ./cmd/moco-release -count=1
          CGO_ENABLED=0 GOWORK=off go -C tools build -mod=readonly -trimpath \
            -o "$RUNNER_TEMP/release-tools/moco-release" ./cmd/moco-release
      - name: Validate SemVer, prerelease status, tag identity and main ancestry
        id: plan
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/release-tools/moco-release" plan \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --plan "$RUNNER_TEMP/release-tools/release-plan.json" --output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tools-${{ steps.plan.outputs.commit }}
          path: ${{ runner.temp }}/release-tools/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  validate:
    needs: prepare
    uses: ./.github/workflows/check.yml

  publish:
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    # Serialize publication, including differently prefixed tags for one version.
    concurrency:
      group: moco-release-publish-${{ github.repository }}-${{ needs.prepare.outputs.oci_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tools-${{ needs.prepare.outputs.commit }}
          path: ${{ runner.temp }}/release-tools
      - name: Enable validated release helper
        run: chmod 0700 "$RUNNER_TEMP/release-tools/moco-release"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea # v0.33.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.1
      - name: Inspect an existing image without overwriting another release
        id: existing
        run: |
          "$RUNNER_TEMP/release-tools/moco-release" image-status \
            --plan "$RUNNER_TEMP/release-tools/release-plan.json" --output "$GITHUB_OUTPUT"
      - name: Publish multi-platform image
        id: image
        if: steps.existing.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.image_repository }}:${{ needs.prepare.outputs.oci_tag }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            index:org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=moco-release
          cache-to: type=gha,mode=max,scope=moco-release
      - name: Publish pinned Helm chart and attach verified release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          "$RUNNER_TEMP/release-tools/moco-release" publish-chart \
            --plan "$RUNNER_TEMP/release-tools/release-plan.json" --image-digest "$IMAGE_DIGEST" \
            --chart charts/moco --out "$RUNNER_TEMP/release-assets"
          cat "$RUNNER_TEMP/release-assets/release.json" >> "$GITHUB_STEP_SUMMARY"
